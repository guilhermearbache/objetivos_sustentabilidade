<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votação Coletiva - GT Clima e Sustentabilidade RME-SP</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Chave única fixa para sincronizar os 8 membros do GT na mesma sala
    const DEFAULT_ROOM_ID = "gt_clima_rmesp_2026_oficial";
    
    // API Key-Value em nuvem pública com suporte total a CORS
    const CLOUD_GET_URL = (roomId) => `https://keyvalue.immanuel.co/api/KeyVal/GetValue/${roomId}`;
    const CLOUD_POST_URL = (roomId, data) => `https://keyvalue.immanuel.co/api/KeyVal/PostValue/${roomId}/${encodeURIComponent(JSON.stringify(data))}`;

    const INITIAL_OBJECTIVES = [
      // Eixo 1 & 2: Educação Ambiental e Conforto/Segurança (Redação Final Consolidada pelo GT)
      {
        id: "obj-1-1",
        code: "1.1",
        axis: "Educação Ambiental",
        category: "Currículo e Atividades",
        title: "Educação Ambiental Universal",
        description: "Garantir que a educação ambiental chegue, nos componentes curriculares e em atividades extra-curriculares, a todas e todos estudantes, sem depender de esforços individuais e pontuais.",
        isFinalDraft: true,
      },
      {
        id: "obj-1-2",
        code: "1.2",
        axis: "Educação Ambiental",
        category: "Alinhamento Curricular",
        title: "Ações Socioambientais na RME-SP",
        description: "Garantir que ações estejam ligadas a questões socioambientais em todos espaços da RME-SP e alinhadas ao currículo da cidade na dimensão de Educação Ambiental.",
        isFinalDraft: true,
      },
      {
        id: "obj-2-1",
        code: "2.1",
        axis: "Adaptação e Segurança Escolar",
        category: "Conforto Térmico e Ar",
        title: "Qualidade do Ar e Conforto Térmico",
        description: "Garantir que bebês, crianças e adolescentes tenham conforto térmico e uma boa qualidade do ar em todas salas de aula e espaços das UEs.",
        isFinalDraft: true,
      },
      {
        id: "obj-2-2",
        code: "2.2",
        axis: "Adaptação e Segurança Escolar",
        category: "Eventos Extremos",
        title: "Segurança e Operação em Eventos Extremos",
        description: "Oferecer condições e orientação antes, durante e depois de eventos extremos para que as escolas da rede permaneçam em operação quando possível, e que acima de tudo a comunidade escolar permaneça segura.",
        isFinalDraft: true,
      },

      // Eixo 3: Mitigação e Sustentabilidade
      {
        id: "obj-3-1",
        code: "3.1",
        axis: "Mitigação e Sustentabilidade",
        category: "Gestão de Resíduos Sólidos",
        title: "Coleta e Separação de Resíduos",
        description: "Melhorar a coleta e separação de resíduos nas UEs e prédios administrativos.",
        isFinalDraft: false,
      },
      {
        id: "obj-3-2",
        code: "3.2",
        axis: "Mitigação e Sustentabilidade",
        category: "Gestão de Água e Energia",
        title: "Consumo e Reúso de Água",
        description: "Diminuir o consumo e aumentar o reuso de água na operação da rede.",
        isFinalDraft: false,
      },
      {
        id: "obj-3-3",
        code: "3.3",
        axis: "Mitigação e Sustentabilidade",
        category: "Gestão de Energia",
        title: "Fontes Renováveis e Eficiência",
        description: "Diminuir o consumo e aumentar o uso de fontes renováveis (como painéis solares) na operação da rede.",
        isFinalDraft: false,
      },
      {
        id: "obj-3-4",
        code: "3.4",
        axis: "Mitigação e Sustentabilidade",
        category: "Compras Sustentáveis",
        title: "Critérios de Ciclo de Vida em Compras",
        description: "Garantir que ciclo de vida do produto e outros critérios de sustentabilidade sejam considerados de forma mais intensa nas compras de uniformes, materiais, limpeza e quaisquer outras aquisições de produtos e serviços.",
        isFinalDraft: false,
      },

      // Eixo 4: Gestão, Governança e Equidade
      {
        id: "obj-4-1",
        code: "4.1",
        axis: "Gestão, Governança e Equidade",
        category: "Dados sobre Infraestrutura e Operação",
        title: "Transparência de Infraestrutura e Recursos",
        description: "Garantir a disponibilidade de informações sobre os prédios, espaços, áreas verdes e consumo de energia e água na rede municipal.",
        isFinalDraft: false,
      },
      {
        id: "obj-4-2",
        code: "4.2",
        axis: "Gestão, Governança e Equidade",
        category: "Dados sobre Educação Ambiental",
        title: "Monitoramento de EA nos PPPs",
        description: "Aumentar a disponibilidade de dados sobre meio-ambiente e clima nos PPPs e sobre projetos de EA e abordagem do assunto nas UEs.",
        isFinalDraft: false,
      },
      {
        id: "obj-4-3",
        code: "4.3",
        axis: "Gestão, Governança e Equidade",
        category: "Governança e Articulação em C&S",
        title: "Instância de Referência e Papéis Regulatórios",
        description: "Ter uma instância de referência e papéis claramente definidos por normativa no que se refere a questões de C&S: ações, projetos e parcerias; resposta a órgãos de controle; formulação e monitoramento de metas e ações em Planos Municipais; entre outros.",
        isFinalDraft: false,
      }
    ];

    const IconCheckCircle = () => (
      <svg className="w-4 h-4 text-emerald-600 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconEdit = () => (
      <svg className="w-4 h-4 text-amber-600 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
    );

    const IconLayers = () => (
      <svg className="w-4 h-4 text-indigo-600 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
    );

    const IconSplit = () => (
      <svg className="w-4 h-4 text-purple-600 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    );

    const IconTrash = () => (
      <svg className="w-4 h-4 text-rose-600 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    const IconSend = () => (
      <svg className="w-4 h-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    );

    const IconBarChart = () => (
      <svg className="w-4 h-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    );

    const IconPlus = () => (
      <svg className="w-4 h-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    );

    const IconRefresh = () => (
      <svg className="w-4 h-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const IconLink = () => (
      <svg className="w-4 h-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
      </svg>
    );

    function App() {
      // Obter ID da Sala pela URL ou LocalStorage
      const roomId = useMemo(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const salaParam = urlParams.get('sala');
        if (salaParam) {
          localStorage.setItem('gt_clima_room_id', salaParam);
          return salaParam;
        }
        return localStorage.getItem('gt_clima_room_id') || DEFAULT_ROOM_ID;
      }, []);

      const [participantName, setParticipantName] = useState("");
      const [activeTab, setActiveTab] = useState("vote");
      const [filterAxis, setFilterAxis] = useState("Todos");
      const [copiedStatus, setCopiedStatus] = useState(false);
      const [copiedLinkStatus, setCopiedLinkStatus] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [validationErrorMsg, setValidationErrorMsg] = useState("");
      const [importJsonInput, setImportJsonInput] = useState("");
      const [showImportModal, setShowImportModal] = useState(false);

      // Propostas de novos objetivos
      const [customProposals, setCustomProposals] = useState([]);

      // Estado dos votos do usuário corrente
      const [votes, setVotes] = useState(() => {
        const initial = {};
        INITIAL_OBJECTIVES.forEach(obj => {
          initial[obj.id] = {
            decision: 'manter',
            newText: '',
            splitProposals: ['', ''],
            groupedWith: [],
            justification: ''
          };
        });
        return initial;
      });

      // Lista consolidada de votos trazida da nuvem/local
      const [submittedBallots, setSubmittedBallots] = useState(() => {
        try {
          const saved = localStorage.getItem(`gt_clima_ballots_${roomId}`);
          return saved ? JSON.parse(saved) : [];
        } catch(e) {
          return [];
        }
      });

      const fetchCloudData = useCallback(async () => {
        setIsSyncing(true);
        try {
          const res = await fetch(CLOUD_GET_URL(roomId));
          if (res.ok) {
            const rawText = await res.text();
            if (rawText && rawText.trim() && rawText !== '""' && rawText !== 'null') {
              let parsed = null;
              try {
                parsed = JSON.parse(rawText);
                if (typeof parsed === 'string') {
                  parsed = JSON.parse(parsed);
                }
              } catch(e) {}

              if (parsed && Array.isArray(parsed.ballots)) {
                setSubmittedBallots(parsed.ballots);
                localStorage.setItem(`gt_clima_ballots_${roomId}`, JSON.stringify(parsed.ballots));
                setLastSyncTime(new Date().toLocaleTimeString('pt-BR'));
              }
            }
          }
        } catch (err) {
          console.warn("Sincronização em nuvem:", err);
        } finally {
          setIsSyncing(false);
        }
      }, [roomId]);

      // Polling automático na nuvem a cada 4 segundos
      useEffect(() => {
        fetchCloudData();
        const interval = setInterval(fetchCloudData, 4000);
        return () => clearInterval(interval);
      }, [fetchCloudData]);

      const saveToCloud = async (newBallotsList) => {
        setIsSyncing(true);
        try {
          const payload = {
            roomId: roomId,
            lastUpdated: new Date().toISOString(),
            ballots: newBallotsList
          };
          
          await fetch(CLOUD_POST_URL(roomId, payload), {
            method: 'POST'
          });
          
          setLastSyncTime(new Date().toLocaleTimeString('pt-BR'));
        } catch (err) {
          console.error("Erro ao salvar na nuvem:", err);
        } finally {
          setIsSyncing(false);
        }
      };

      const axes = useMemo(() => {
        return ["Todos", ...Array.from(new Set(INITIAL_OBJECTIVES.map(o => o.axis)))];
      }, []);

      const handleDecisionChange = (objId, newDecision) => {
        setValidationErrorMsg("");
        setVotes(prev => {
          const current = prev[objId] || {};
          const updated = { 
            ...prev, 
            [objId]: { 
              ...current, 
              decision: newDecision,
              splitProposals: current.splitProposals && current.splitProposals.length >= 2 ? current.splitProposals : ['', ''] 
            } 
          };
          
          if (newDecision !== 'agrupar' && current.groupedWith?.length > 0) {
            current.groupedWith.forEach(targetId => {
              if (updated[targetId]?.decision === 'agrupar') {
                const cleanTargets = (updated[targetId].groupedWith || []).filter(id => id !== objId);
                updated[targetId] = {
                  ...updated[targetId],
                  groupedWith: cleanTargets,
                  decision: cleanTargets.length === 0 ? 'manter' : 'agrupar'
                };
              }
            });
            updated[objId].groupedWith = [];
          }
          return updated;
        });
      };

      const handleToggleGroup = (sourceId, targetId) => {
        setValidationErrorMsg("");
        setVotes(prev => {
          const updated = { ...prev };
          const sourceVote = { ...(updated[sourceId] || { decision: 'agrupar', groupedWith: [], newText: '', justification: '', splitProposals: ['', ''] }) };
          const targetVote = { ...(updated[targetId] || { decision: 'agrupar', groupedWith: [], newText: '', justification: '', splitProposals: ['', ''] }) };

          const isAlreadyGrouped = (sourceVote.groupedWith || []).includes(targetId);

          if (isAlreadyGrouped) {
            sourceVote.groupedWith = sourceVote.groupedWith.filter(id => id !== targetId);
            targetVote.groupedWith = (targetVote.groupedWith || []).filter(id => id !== sourceId);

            if (sourceVote.groupedWith.length === 0) sourceVote.decision = 'manter';
            if (targetVote.groupedWith.length === 0) targetVote.decision = 'manter';
          } else {
            sourceVote.decision = 'agrupar';
            sourceVote.groupedWith = Array.from(new Set([...(sourceVote.groupedWith || []), targetId]));

            targetVote.decision = 'agrupar';
            targetVote.groupedWith = Array.from(new Set([...(targetVote.groupedWith || []), sourceId]));

            const combinedText = sourceVote.newText || targetVote.newText || "";
            sourceVote.newText = combinedText;
            targetVote.newText = combinedText;
          }

          updated[sourceId] = sourceVote;
          updated[targetId] = targetVote;
          return updated;
        });
      };

      const handleSplitTextChange = (objId, index, value) => {
        setVotes(prev => {
          const current = { ...(prev[objId] || {}) };
          const splits = [...(current.splitProposals || ['', ''])];
          splits[index] = value;
          return {
            ...prev,
            [objId]: { ...current, splitProposals: splits }
          };
        });
      };

      const handleAddSplitField = (objId) => {
        setVotes(prev => {
          const current = { ...(prev[objId] || {}) };
          const splits = [...(current.splitProposals || ['', '']), ''];
          return {
            ...prev,
            [objId]: { ...current, splitProposals: splits }
          };
        });
      };

      const handleRemoveSplitField = (objId, index) => {
        setVotes(prev => {
          const current = { ...(prev[objId] || {}) };
          let splits = [...(current.splitProposals || ['', ''])];
          if (splits.length > 2) {
            splits = splits.filter((_, i) => i !== index);
          }
          return {
            ...prev,
            [objId]: { ...current, splitProposals: splits }
          };
        });
      };

      const handleNewTextChange = (objId, text) => {
        setVotes(prev => {
          const updated = { ...prev };
          const current = { ...(updated[objId] || {}) };
          current.newText = text;
          updated[objId] = current;

          if (current.decision === 'agrupar' && current.groupedWith?.length > 0) {
            current.groupedWith.forEach(gId => {
              if (updated[gId]) {
                updated[gId] = { ...updated[gId], newText: text };
              }
            });
          }
          return updated;
        });
      };

      const handleJustificationChange = (objId, text) => {
        setValidationErrorMsg("");
        setVotes(prev => ({
          ...prev,
          [objId]: { ...prev[objId], justification: text }
        }));
      };

      const handleAddCustomProposalByAxis = (axisName) => {
        setCustomProposals(prev => [
          ...prev,
          { id: 'prop-' + Date.now(), axis: axisName, title: '', text: '', justification: '' }
        ]);
      };

      const handleRemoveCustomProposal = (id) => {
        setCustomProposals(prev => prev.filter(p => p.id !== id));
      };

      const handleUpdateCustomProposal = (id, field, value) => {
        setCustomProposals(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));
      };

      const handleSubmitVote = async (e) => {
        e.preventDefault();
        setValidationErrorMsg("");

        // VALIDAÇÃO: Justificativa obrigatória para escolhas além de 'manter'
        const invalidItems = [];
        INITIAL_OBJECTIVES.forEach(obj => {
          const v = votes[obj.id];
          if (v && v.decision !== 'manter') {
            if (!v.justification || !v.justification.trim()) {
              invalidItems.push(obj.code);
            }
          }
        });

        if (invalidItems.length > 0) {
          setValidationErrorMsg(`A justificativa é OBRIGATÓRIA para escolhas além de "Manter"! Preencha no(s) item(ns): ${invalidItems.join(", ")}.`);
          const firstInvalid = document.getElementById(`card-${invalidItems[0]}`);
          if (firstInvalid) {
            firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          return;
        }

        const newBallot = {
          id: 'ballot-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
          voterName: participantName.trim() || "Anônimo",
          submittedAt: new Date().toLocaleString('pt-BR'),
          votes: JSON.parse(JSON.stringify(votes)),
          customProposals: JSON.parse(JSON.stringify(customProposals))
        };

        const updatedList = [newBallot, ...submittedBallots];
        setSubmittedBallots(updatedList);
        try {
          localStorage.setItem(`gt_clima_ballots_${roomId}`, JSON.stringify(updatedList));
        } catch(err) {}

        // Enviar para a Nuvem Compartilhada
        await saveToCloud(updatedList);

        setActiveTab("summary");
      };

      const handleDeleteBallot = async (ballotToDelete) => {
        const filtered = submittedBallots.filter(b => b.id !== ballotToDelete.id);
        setSubmittedBallots(filtered);
        try {
          localStorage.setItem(`gt_clima_ballots_${roomId}`, JSON.stringify(filtered));
        } catch(e) {}

        await saveToCloud(filtered);
      };

      const handleCopyShareableLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const shareUrl = `${baseUrl}?sala=${roomId}`;
        
        const textArea = document.createElement("textarea");
        textArea.value = shareUrl;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          setCopiedLinkStatus(true);
          setTimeout(() => setCopiedLinkStatus(false), 3000);
        } catch (err) {}
        document.body.removeChild(textArea);
      };

      const handleImportJsonSubmit = async () => {
        if (!importJsonInput.trim()) return;
        try {
          const parsed = JSON.parse(importJsonInput);
          let newItems = [];
          if (Array.isArray(parsed)) {
            newItems = parsed;
          } else if (parsed.individualBallots && Array.isArray(parsed.individualBallots)) {
            newItems = parsed.individualBallots;
          } else if (parsed.id && parsed.voterName) {
            newItems = [parsed];
          }

          if (newItems.length > 0) {
            const merged = [...submittedBallots];
            newItems.forEach(item => {
              if (!merged.some(m => m.id === item.id)) {
                merged.unshift(item);
              }
            });
            setSubmittedBallots(merged);
            localStorage.setItem(`gt_clima_ballots_${roomId}`, JSON.stringify(merged));
            await saveToCloud(merged);
            setShowImportModal(false);
            setImportJsonInput("");
          }
        } catch (e) {}
      };

      const handleNewBallot = () => {
        setParticipantName("");
        setValidationErrorMsg("");
        setCustomProposals([]);
        const reset = {};
        INITIAL_OBJECTIVES.forEach(obj => {
          reset[obj.id] = { decision: 'manter', newText: '', splitProposals: ['', ''], groupedWith: [], justification: '' };
        });
        setVotes(reset);
        setActiveTab("vote");
      };

      const statsByObjective = useMemo(() => {
        return INITIAL_OBJECTIVES.map(obj => {
          const counts = { manter: 0, alterar: 0, excluir: 0, agrupar: 0, dividir: 0 };
          const suggestions = [];
          const splitSuggestions = [];
          const comments = [];

          submittedBallots.forEach(ballot => {
            const v = ballot.votes ? ballot.votes[obj.id] : null;
            if (v) {
              counts[v.decision] = (counts[v.decision] || 0) + 1;
              if (v.newText) {
                suggestions.push({ author: ballot.voterName, text: v.newText, decision: v.decision });
              }
              if (v.decision === 'dividir' && v.splitProposals) {
                const validSplits = v.splitProposals.filter(sp => sp && sp.trim());
                if (validSplits.length > 0) {
                  splitSuggestions.push({ author: ballot.voterName, splits: validSplits });
                }
              }
              if (v.justification) {
                comments.push({ author: ballot.voterName, text: v.justification, decision: v.decision });
              }
            }
          });

          return {
            ...obj,

                                              onClick={() => handleToggleGroup(obj.id, targetObj.id)}
                                              className={`flex items-start gap-2 p-2.5 rounded-lg text-left text-xs transition-all border ${
                                                isSelected
                                                  ? 'bg-indigo-600 text-white border-indigo-700 shadow-sm font-semibold'
                                                  : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300'
                                              }`}
                                            >
                                              <span className={`w-4 h-4 rounded flex items-center justify-center flex-shrink-0 text-[10px] ${
                                                isSelected ? 'bg-white text-indigo-700 font-bold' : 'border border-slate-300 bg-slate-50'
                                              }`}>
                                                {isSelected ? '✓' : ''}
                                              </span>
                                              <div>
                                                <span className="font-mono font-bold">[{targetObj.code}]</span> {targetObj.title}
                                              </div>
                                            </button>
                                          );
                                        })}
                                      </div>
                                    </div>
                                  )}

                                  {/* Campo de Sugestão de Nova Redação */}
                                  {(currentVote.decision === 'alterar' || currentVote.decision === 'agrupar') && (
                                    <div className="space-y-1.5">
                                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                                        {currentVote.decision === 'agrupar' 
                                          ? "Sugestão de Redação Unificada para o Grupo de Objetivos:" 
                                          : "Sugestão de Nova Redação:"}
                                      </label>
                                      <textarea
                                        rows={3}
                                        value={currentVote.newText || ""}
                                        onChange={(e) => handleNewTextChange(obj.id, e.target.value)}
                                        placeholder="Escreva aqui a nova proposta de texto..."
                                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white"
                                      />
                                    </div>
                                  )}

                                  {/* Campo de Justificativa OBRIGATÓRIA se não for 'manter' */}
                                  <div className="space-y-1">
                                    <label className="block text-xs font-bold uppercase tracking-wider flex items-center justify-between">
                                      <span className={needsJustification ? "text-rose-700" : "text-slate-600"}>
                                        Justificativa e Comentários {needsJustification ? "(OBRIGATÓRIO * )" : "(Opcional)"}:
                                      </span>
                                      {needsJustification && (
                                        <span className="text-[10px] font-extrabold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">
                                          Obrigatório para {currentVote.decision}
                                        </span>
                                      )}
                                    </label>
                                    <input
                                      type="text"
                                      required={needsJustification}
                                      value={currentVote.justification || ""}
                                      onChange={(e) => handleJustificationChange(obj.id, e.target.value)}
                                      placeholder={
                                        needsJustification 
                                          ? "Explique o motivo desta escolha (obrigatório)..." 
                                          : "Ex: Adequação com a meta municipal / Clareza de redação..."
                                      }
                                      className={`w-full px-3.5 py-2 rounded-xl border focus:outline-none focus:ring-2 text-xs transition-all ${
                                        isJustificationMissing && validationErrorMsg
                                          ? 'border-rose-500 bg-rose-50/50 focus:ring-rose-400'
                                          : 'border-slate-300 bg-slate-50 focus:bg-white focus:ring-slate-400'
                                      }`}
                                    />
                                  </div>

                                </div>
                              </div>
                            );
                          })}
                        </div>

                        {/* Botão de Adicionar Novo Objetivo neste Eixo */}
                        <div className="bg-white rounded-2xl p-4 border border-dashed border-emerald-300 hover:border-emerald-500 transition-all text-center space-y-3">
                          <div className="flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div className="text-left">
                              <span className="text-xs font-bold text-emerald-900 block">
                                Propor Novo Objetivo no Eixo "{axisName}"
                              </span>
                              <span className="text-[11px] text-slate-500">
                                Sentiu falta de alguma pauta neste eixo? Clique para adicionar uma nova proposta.
                              </span>
                            </div>
                            <button
                              type="button"
                              onClick={() => handleAddCustomProposalByAxis(axisName)}
                              className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex items-center gap-1.5 transition-all shadow-sm shrink-0"
                            >
                              <IconPlus /> Adicionar Novo Objetivo neste Eixo
                            </button>
                          </div>

                          {axisProposals.length > 0 && (
                            <div className="space-y-3 pt-2 text-left">
                              {axisProposals.map((prop, pIndex) => (
                                <div key={prop.id} className="p-4 bg-emerald-50/60 rounded-xl border border-emerald-200 space-y-2 relative">
                                  <button
                                    type="button"
                                    onClick={() => handleRemoveCustomProposal(prop.id)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-rose-600 font-bold text-xs"
                                  >
                                    ✕ Remover
                                  </button>
                                  
                                  <div className="text-xs font-bold text-emerald-900 uppercase">
                                    Nova Proposta #{pIndex + 1} no Eixo {axisName}:
                                  </div>

                                  <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-0.5">Título / Resumo:</label>
                                    <input
                                      type="text"
                                      value={prop.title}
                                      onChange={(e) => handleUpdateCustomProposal(prop.id, 'title', e.target.value)}
                                      placeholder="Ex: Horta escolar sustentável nas UEs"
                                      className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs bg-white"
                                    />
                                  </div>

                                  <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-0.5">Redação Proposta:</label>
                                    <textarea
                                      rows={2}
                                      value={prop.text}
                                      onChange={(e) => handleUpdateCustomProposal(prop.id, 'text', e.target.value)}
                                      placeholder="Descreva detalhadamente o texto do novo objetivo..."
                                      className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs bg-white"
                                    />
                                  </div>

                                  <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-0.5">Justificativa:</label>
                                    <input
                                      type="text"
                                      value={prop.justification}
                                      onChange={(e) => handleUpdateCustomProposal(prop.id, 'justification', e.target.value)}
                                      placeholder="Explique a relevância para este eixo..."
                                      className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs bg-white"
                                    />
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                      </div>
                    );
                  })}
                </div>

                {/* Barra de Envio */}
                <div className="sticky bottom-4 z-20 bg-slate-900 text-white p-4 rounded-2xl shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-4 border border-slate-700">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center font-extrabold text-white">
                      11
                    </div>
                    <div>
                      <div className="text-xs text-slate-400 font-semibold">Cédula de Voto (Sincronizada)</div>
                      <div className="text-sm font-bold">
                        Votante: {participantName.trim() || "Anônimo"}
                      </div>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={isSyncing}
                    className="w-full sm:w-auto px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-sm flex items-center justify-center gap-2 transition-all shadow-lg cursor-pointer"
                  >
                    <IconSend />
                    {isSyncing ? "Enviando para Nuvem..." : "Registrar Meu Voto"}
                  </button>
                </div>

              </form>
            )}

            {activeTab === "summary" && (
              <div className="space-y-6">
                
                {/* Header do Consolidado */}
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                  <div>
                    <div className="text-xs font-bold uppercase tracking-wider text-emerald-700 flex items-center gap-1">
                      <IconBarChart />
                      Resultado Geral do GT (Sincronização em Tempo Real)
                    </div>
                    <h2 className="text-xl font-bold text-slate-900 mt-1">
                      Painel Consolidado de Deliberações
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Total de votos contabilizados na nuvem: <strong className="text-slate-800">{submittedBallots.length}</strong> participante(s).
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={handleNewBallot}
                      className="px-3.5 py-2 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 border border-emerald-200 rounded-xl text-xs font-bold transition-all"
                    >
                      + Novo Voto
                    </button>
                    <button
                      onClick={() => setShowImportModal(true)}
                      className="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-200 rounded-xl text-xs font-bold transition-all"
                    >
                      📥 Importar JSON
                    </button>
                    <button
                      onClick={handleCopySummary}
                      className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-bold transition-all"
                    >
                      {copiedStatus ? "Copiado!" : "Copiar Resumo"}
                    </button>
                    <button
                      onClick={handleExportData}
                      disabled={submittedBallots.length === 0}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                        submittedBallots.length > 0
                          ? 'bg-slate-900 hover:bg-slate-800 text-white'
                          : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      }`}
                    >
                      Baixar JSON
                    </button>
                  </div>
                </div>

                {submittedBallots.length === 0 ? (
                  <div className="bg-white p-12 text-center rounded-2xl border border-dashed border-slate-300">
                    <p className="text-base font-bold text-slate-700 mb-1">Nenhum voto registrado ainda na nuvem</p>
                    <p className="text-xs text-slate-500 mb-4">Preencha a cédula para ver as estatísticas consolidadas do grupo.</p>
                    <button
                      onClick={() => setActiveTab("vote")}
                      className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700"
                    >
                      Ir para Votação
                    </button>
                  </div>
                ) : (
                  <>
                    {/* Lista Consolidada por Objetivo */}
                    <div className="space-y-4">
                      {statsByObjective.map((item) => {
                        const total = item.totalCast || 1;
                        const pManter = Math.round((item.counts.manter / total) * 100);
                        const pAlterar = Math.round((item.counts.alterar / total) * 100);
                        const pDividir = Math.round((item.counts.dividir / total) * 100);
                        const pExcluir = Math.round((item.counts.excluir / total) * 100);
                        const pAgrupar = Math.round((item.counts.agrupar / total) * 100);

                        return (
                          <div key={item.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
                            
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 pb-3 border-b border-slate-100">
                              <div>
                                <div className="flex items-center gap-2 mb-1">
                                  <span className="font-mono text-xs font-bold px-2 py-0.5 bg-slate-900 text-white rounded">
                                    {item.code}
                                  </span>
                                  <span className="text-xs font-semibold text-slate-600">
                                    {item.axis}
                                  </span>
                                  {item.isFinalDraft && (
                                    <span className="text-[10px] font-bold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full">
                                      Redação Final Consolidada
                                    </span>
                                  )}
                                </div>
                                <h3 className="text-base font-bold text-slate-900">
                                  {item.title}
                                </h3>
                              </div>
                            </div>

                            <p className="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100">
                              {item.description}
                            </p>

                            {/* Placar de Votação */}
                            <div className="space-y-1.5">
                              <div className="text-xs font-bold text-slate-700">Contagem dos Votos ({total} votantes):</div>
                              <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                                <div className="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl text-center">
                                  <div className="text-[11px] font-bold text-emerald-800">Manter</div>
                                  <div className="text-base font-extrabold text-emerald-900">{item.counts.manter} ({pManter}%)</div>
                                </div>
                                <div className="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-center">
                                  <div className="text-[11px] font-bold text-amber-800">Alterar</div>
                                  <div className="text-base font-extrabold text-amber-900">{item.counts.alterar} ({pAlterar}%)</div>
                                </div>
                                <div className="bg-purple-50 border border-purple-200 p-2.5 rounded-xl text-center">
                                  <div className="text-[11px] font-bold text-purple-800">Dividir</div>
                                  <div className="text-base font-extrabold text-purple-900">{item.counts.dividir} ({pDividir}%)</div>
                                </div>
                                <div className="bg-indigo-50 border border-indigo-200 p-2.5 rounded-xl text-center">
                                  <div className="text-[11px] font-bold text-indigo-800">Agrupar</div>
                                  <div className="text-base font-extrabold text-indigo-900">{item.counts.agrupar} ({pAgrupar}%)</div>
                                </div>
                                <div className="bg-rose-50 border border-rose-200 p-2.5 rounded-xl text-center">
                                  <div className="text-[11px] font-bold text-rose-800">Excluir</div>
                                  <div className="text-base font-extrabold text-rose-900">{item.counts.excluir} ({pExcluir}%)</div>
                                </div>
                              </div>
                            </div>

                            {/* Sugestões de Redação Registradas */}
                            {item.suggestions.length > 0 && (
                              <div className="space-y-2 pt-2">
                                <div className="text-xs font-bold text-slate-800 flex items-center gap-1">
                                  <IconEdit />
                                  Sugestões de Redação Recebidas ({item.suggestions.length}):
                                </div>
                                <div className="space-y-1.5">
                                  {item.suggestions.map((sug, idx) => (
                                    <div key={idx} className="bg-amber-50/70 border border-amber-200 p-3 rounded-xl text-xs text-slate-800">
                                      <div className="font-bold text-amber-900 mb-0.5 flex items-center justify-between">
                                        <span>{sug.author}</span>
                                        <span className="text-[10px] uppercase font-bold px-1.5 py-0.2 bg-amber-200 rounded">
                                          {sug.decision}
                                        </span>
                                      </div>
                                      <p className="text-slate-900 font-medium">{sug.text}</p>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}

                            {/* Propostas de Divisão Registradas */}
                            {item.splitSuggestions.length > 0 && (
                              <div className="space-y-2 pt-2">
                                <div className="text-xs font-bold text-purple-900 flex items-center gap-1">
                                  <IconSplit />
                                  Propostas de Divisão deste Objetivo ({item.splitSuggestions.length}):
                                </div>
                                <div className="space-y-2">
                                  {item.splitSuggestions.map((sp, idx) => (
                                    <div key={idx} className="bg-purple-50/80 border border-purple-200 p-3 rounded-xl text-xs space-y-1">
                                      <div className="font-bold text-purple-900">Por {sp.author}:</div>
                                      <ol className="list-decimal list-inside space-y-1 pl-1">
                                        {sp.splits.map((part, pIdx) => (
                                          <li key={pIdx} className="text-slate-800 font-medium">{part}</li>
                                        ))}
                                      </ol>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}

                            {/* Comentários / Justificativas */}
                            {item.comments.length > 0 && (
                              <div className="space-y-1.5 pt-1">
                                <div className="text-xs font-bold text-slate-700">Justificativas / Comentários Registrados:</div>
                                <div className="space-y-1">
                                  {item.comments.map((comm, idx) => (
                                    <div key={idx} className="bg-slate-50 border border-slate-200 p-2.5 rounded-lg text-xs text-slate-700">
                                      <strong className="text-slate-900">{comm.author}</strong> <span className="text-[10px] font-bold bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded uppercase mr-1">({comm.decision})</span>: {comm.text}
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}

                          </div>
                        );
                      })}
                    </div>

                    {/* Propostas de Novos Objetivos por Eixo */}
                    {allCustomProposalsConsolidated.length > 0 && (
                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h3 className="text-sm font-bold text-slate-900 flex items-center gap-1.5">
                          <IconPlus />
                          Novos Objetivos Propostos nos Eixos ({allCustomProposalsConsolidated.length})
                        </h3>
                        <div className="space-y-2">
                          {allCustomProposalsConsolidated.map((p, idx) => (
                            <div key={idx} className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs space-y-1">
                              <div className="flex items-center justify-between font-bold">
                                <span className="text-emerald-800">Eixo: {p.axis}</span>
                                <span className="text-slate-500 font-normal">por {p.author}</span>
                              </div>
                              {p.title && <div className="font-semibold text-slate-900">Título: {p.title}</div>}
                              <div className="text-slate-800">Proposta: {p.text}</div>
                              {p.justification && <div className="text-slate-500 italic">Justificativa: {p.justification}</div>}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                      <div className="flex items-center justify-between">
                        <div>
                          <h3 className="text-sm font-bold text-slate-900">
                            Cédulas Registradas na Nuvem ({submittedBallots.length})
                          </h3>
                          <p className="text-xs text-slate-500">
                            Gerencie os votos do grupo. Você pode excluir votos de teste enviados anteriormente.
                          </p>
                        </div>
                      </div>

                      <div className="divide-y divide-slate-100 border border-slate-100 rounded-xl overflow-hidden">
                        {submittedBallots.map((ballot, idx) => (
                          <div key={ballot.id || idx} className="p-3 bg-slate-50/50 hover:bg-slate-50 flex items-center justify-between gap-3 text-xs">
                            <div>
                              <span className="font-bold text-slate-900">{ballot.voterName}</span>
                              <span className="text-slate-400 ml-2">({ballot.submittedAt})</span>
                            </div>
                            <button
                              onClick={() => handleDeleteBallot(ballot)}
                              className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold rounded-lg transition-all flex items-center gap-1"
                            >
                              <IconTrash /> Excluir Voto
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}

                {/* Modal de Importação Manual em JSON */}
                {showImportModal && (
                  <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4">
                      <div className="flex items-center justify-between border-b pb-3">
                        <h3 className="text-base font-bold text-slate-900">Importar Voto em JSON</h3>
                        <button
                          onClick={() => setShowImportModal(false)}
                          className="text-slate-400 hover:text-slate-600 font-bold"
                        >
                          ✕
                        </button>
                      </div>
                      <p className="text-xs text-slate-600">
                        Cole abaixo o texto do JSON de um voto exportado por algum participante para adicioná-lo ao consolidado:
                      </p>
                      <textarea
                        rows={6}
                        value={importJsonInput}
                        onChange={(e) => setImportJsonInput(e.target.value)}
                        placeholder="Cole o código JSON aqui..."
                        className="w-full p-3 border rounded-xl font-mono text-xs bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                      <div className="flex justify-end gap-2 pt-2">
                        <button
                          onClick={() => setShowImportModal(false)}
                          className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-200"
                        >
                          Cancelar
                        </button>
                        <button
                          onClick={handleImportJsonSubmit}
                          className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs hover:bg-indigo-700 shadow"
                        >
                          Confirmar Importação
                        </button>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            )}

          </main>

          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            Grupo de Trabalho de Clima e Sustentabilidade • RME-SP
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
